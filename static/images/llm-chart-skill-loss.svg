<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Skills drop when AI does the work</title>
  <desc id="d">Left: Anthropic 2026 randomized trial, quiz score after learning a new Python library. Hand-coding group 67 percent, AI-assisted group 50 percent. Right: Lancet Gastroenterology and Hepatology 2025, adenoma detection rate of colonoscopies done without AI. Before endoscopists were exposed to AI 28.4 percent, after exposure 22.4 percent.</desc>
  <rect width="720" height="380" rx="12" fill="#fcfcfb"/>
  <text x="24" y="36" font-size="18" font-weight="600" fill="#0b0b0b">Skills drop when AI does the work</text>

  <!-- legend -->
  <rect x="24" y="52" width="12" height="12" rx="3" fill="#2a78d6"/>
  <text x="42" y="62" font-size="12" fill="#52514e">Without AI</text>
  <rect x="120" y="52" width="12" height="12" rx="3" fill="#eb6834"/>
  <text x="138" y="62" font-size="12" fill="#52514e">With / after AI</text>

  <!-- Panel A: quiz score, 0-80% over 180px (2.25px per point), baseline y=290 -->
  <text x="40" y="96" font-size="13" font-weight="600" fill="#0b0b0b">Developers: quiz score on a new library</text>
  <g stroke="#e4e3df" stroke-width="1">
    <line x1="40" y1="245" x2="330" y2="245"/>
    <line x1="40" y1="200" x2="330" y2="200"/>
    <line x1="40" y1="155" x2="330" y2="155"/>
    <line x1="40" y1="110" x2="330" y2="110"/>
  </g>
  <g font-size="10" fill="#52514e" text-anchor="end">
    <text x="34" y="293">0</text><text x="34" y="248">20%</text><text x="34" y="203">40%</text><text x="34" y="158">60%</text><text x="34" y="113">80%</text>
  </g>
  <rect x="80" y="139.25" width="80" height="150.75" rx="4" fill="#2a78d6"/>
  <rect x="190" y="177.5" width="80" height="112.5" rx="4" fill="#eb6834"/>
  <g font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">
    <text x="120" y="131">67%</text><text x="230" y="169">50%</text>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="120" y="308">Hand-coding</text><text x="230" y="308">AI-assisted</text>
  </g>

  <!-- Panel B: adenoma detection rate, 0-35% over 180px (5.143px per point) -->
  <text x="400" y="96" font-size="13" font-weight="600" fill="#0b0b0b">Doctors: detection rate without AI</text>
  <g stroke="#e4e3df" stroke-width="1">
    <line x1="400" y1="238.6" x2="690" y2="238.6"/>
    <line x1="400" y1="187.1" x2="690" y2="187.1"/>
    <line x1="400" y1="135.7" x2="690" y2="135.7"/>
  </g>
  <g font-size="10" fill="#52514e" text-anchor="end">
    <text x="394" y="293">0</text><text x="394" y="241.6">10%</text><text x="394" y="190.1">20%</text><text x="394" y="138.7">30%</text>
  </g>
  <rect x="440" y="143.9" width="80" height="146.1" rx="4" fill="#2a78d6"/>
  <rect x="550" y="174.8" width="80" height="115.2" rx="4" fill="#eb6834"/>
  <g font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">
    <text x="480" y="136">28.4%</text><text x="590" y="167">22.4%</text>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="480" y="308">Before AI exposure</text><text x="590" y="308">After AI exposure</text>
  </g>

  <g stroke="#52514e" stroke-width="1.5">
    <line x1="40" y1="290" x2="330" y2="290"/>
    <line x1="400" y1="290" x2="690" y2="290"/>
  </g>

  <text x="24" y="340" font-size="11" fill="#52514e">Left: Anthropic (2026), “How AI assistance impacts the formation of coding skills”, randomized trial, 52 engineers.</text>
  <text x="24" y="358" font-size="11" fill="#52514e">Right: Budzyń et al., The Lancet Gastroenterology &amp; Hepatology (2025), 4 centres in Poland, 1,443 colonoscopies.</text>
</svg>
